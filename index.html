    function extractJSON(text) {
      if (!text) return null;
      try { return JSON.parse(text); } catch (e) {}
      const cleaned = text.replace(/```json/gi, '').replace(/```/g, '').trim();
      try { return JSON.parse(cleaned); } catch (e) {}
      const matchObj = cleaned.match(/\{[\s\S]*\}/);
      if (matchObj) { try { return JSON.parse(matchObj[0]); } catch (e) {} }
      const matchArr = cleaned.match(/\[[\s\S]*\]/);
      if (matchArr) { try { return JSON.parse(matchArr[0]); } catch (e) {} }
      return null;
    }

        });

    }

    async function callUniversalAI(prompt, provider, model, openrouterKey, geminiKey, systemInstruction = "") {
      if (provider === 'openrouter') {
        if (!openrouterKey || openrouterKey.trim() === "") {
          throw new Error("NO_KEY: Silakan masukkan OpenRouter API Key di menu API Settings.");
        }

        const endpoint = "https://openrouter.ai/api/v1/chat/completions";
        const messages = [];
        if (systemInstruction) {
          messages.push({ role: "system", content: systemInstruction });
        }
        messages.push({ role: "user", content: prompt });

        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${openrouterKey.trim()}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.origin || "https://github.com",
            "X-Title": "AI Documentary Studio"
          },
          body: JSON.stringify({
            model: model || "openrouter/free",
            messages: messages,
            temperature: 0.7
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `OpenRouter API Error (${response.status})`);
        }

        const data = await response.json();
        return data.choices?.[0]?.message?.content || "";
      } else {
        if (!geminiKey || geminiKey.trim() === "") {
          throw new Error("NO_KEY: Silakan masukkan Google Gemini API Key di API Settings.");
        }

        const modelToUse = model || "gemini-2.5-flash";
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent?key=${geminiKey.trim()}`;

        const requestBody = {
          contents: [{ role: "user", parts: [{ text: prompt }] }]
        };

        if (systemInstruction) {
          requestBody.systemInstruction = { parts: [{ text: systemInstruction }] };
        }

        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          if (response.status === 429 || errData.error?.message?.toLowerCase().includes("quota")) {
            throw new Error("QUOTA_EXCEEDED: Rate limit/kuota Gemini API tercapai.");
          }
          throw new Error(errData.error?.message || `Gemini API Request failed (${response.status})`);
        }

        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
      }
    }

                          <p className={`text-xs leading-relaxed ${theme.textTitle}`}>{masterConsistencySheet.bodyColoration}</p>
                        </div>
                        <div className={`p-4 rounded-2xl border ${theme.cardInnerBg}`}>
                          <span className="text-[10px] font-extrabold uppercase text-emerald-700 dark:text-emerald-400 block mb-1">Pola & Ciri Khas</span>
                          <p className={`text-xs leading-relaxed ${theme.textTitle}`}>{masterConsistencySheet.markingsAndPatterns}</p>
                        </div>
                        <div className={`p-4 rounded-2xl border ${theme.cardInnerBg}`}>
                          <span className="text-[10px] font-extrabold uppercase text-emerald-700 dark:text-emerald-400 block mb-1">Skala & Proporsi</span>
                          <p className={`text-xs leading-relaxed ${theme.textTitle}`}>{masterConsistencySheet.proportionsAndSize}</p>
                        </div>
                        <div className={`p-4 rounded-2xl border ${theme.cardInnerBg}`}>
                          <span className="text-[10px] font-extrabold uppercase text-emerald-700 dark:text-emerald-400 block mb-1">Pencahayaan & Atmosfer</span>
                          <p className={`text-xs leading-relaxed ${theme.textTitle}`}>{masterConsistencySheet.lightingAndAtmosphere}</p>
                        </div>
                      </div>

                      <div className={`p-5 rounded-2xl border space-y-2 ${theme.cardInnerBg}`}>
                        <div className="flex justify-between items-center">
                          <span className="text-[10px] font-extrabold uppercase text-emerald-700 dark:text-emerald-400">Master Prompt Tag Snippet</span>
                          <button
                            onClick={() => copyToClipboard(masterConsistencySheet.masterPromptSnippet, "Master Prompt")}
                            className="text-xs text-emerald-700 dark:text-emerald-400 font-bold hover:underline"
                          >
                            Copy Tag
                          </button>
                        </div>
                        <p className="text-xs font-mono leading-relaxed bg-slate-900 text-emerald-300 p-3.5 rounded-xl border border-slate-800">
                          {masterConsistencySheet.masterPromptSnippet}
                        </p>
                      </div>
                    </div>
                  ) : (
                    <div className={`text-center py-16 rounded-3xl border text-xs ${theme.cardBg} ${theme.textMuted}`}>
                      Master Consistency Sheet belum dibuat.
                    </div>
                  )}
                </div>
              )}

              {/* TAB 5: STORYBOARDS */}
              {activeTab === 'storyboards' && (
                <div className="max-w-5xl mx-auto space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <span className="text-xs font-extrabold text-emerald-700 dark:text-emerald-400 uppercase tracking-widest">Director of Photography</span>
                      <h2 className={`text-2xl font-black mt-0.5 ${theme.textTitle}`}>Storyboard & Dual Prompt AI</h2>
                    </div>
                    <span className="text-xs font-bold px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                      Total {storyboardShots.length} Shots
                    </span>
                  </div>

                  {storyboardShots.length > 0 ? (
                    <div className="space-y-6">
                      {storyboardShots.map((shot) => (
                        <div key={shot.shotNumber} className={`p-6 rounded-3xl border space-y-4 ${theme.cardBg}`}>
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b pb-3 border-slate-100 dark:border-slate-800">
                            <div className="flex items-center space-x-3">
                              <span className="bg-emerald-600 text-white font-black text-xs px-3 py-1 rounded-xl">
                                SHOT #{shot.shotNumber}
                              </span>
                              <span className={`font-bold text-xs ${theme.textTitle}`}>{shot.segmentName}</span>
                            </div>
                            <div className="flex items-center space-x-2 text-[11px] font-mono text-emerald-700 dark:text-emerald-400">
                              <span>⏱️ {shot.durationSec}s</span>
                              <span>•</span>
                              <span>📷 {shot.cameraComposition}</span>
                            </div>
                          </div>

                          <div className={`text-xs italic p-3 rounded-xl ${theme.cardInnerBg} ${theme.textTitle}`}>
                            " {shot.narration} "
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
                              <div className="flex justify-between items-center">
                                <span className="text-[10px] font-extrabold text-cyan-400 uppercase tracking-wider">🖼️ Text-to-Image Prompt</span>
                                <button
                                  onClick={() => copyToClipboard(shot.imagePrompt, `Prompt Gambar #${shot.shotNumber}`)}
                                  className="text-[10px] text-cyan-400 hover:underline font-bold"
                                >
                                  Copy
                                </button>
                              </div>
                              <p className="text-[11px] font-mono text-slate-300 leading-relaxed">{shot.imagePrompt}</p>
                            </div>

                            <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
                              <div className="flex justify-between items-center">
                                <span className="text-[10px] font-extrabold text-amber-400 uppercase tracking-wider">📹 Image-to-Video Motion Prompt</span>
                                <button
                                  onClick={() => copyToClipboard(shot.videoPrompt, `Prompt Video #${shot.shotNumber}`)}
                                  className="text-[10px] text-amber-400 hover:underline font-bold"
                                >
                                  Copy
                                </button>
                              </div>
                              <p className="text-[11px] font-mono text-slate-300 leading-relaxed">{shot.videoPrompt}</p>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className={`text-center py-16 rounded-3xl border text-xs ${theme.cardBg} ${theme.textMuted}`}>
                      Storyboard shot breakdown belum digenerate.
                    </div>
                  )}
                </div>
              )}

              {/* TAB 6: AUDIO */}
              {activeTab === 'audio' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div>
                    <span className="text-xs font-extrabold text-emerald-700 dark:text-emerald-400 uppercase tracking-widest">Audio Engineering</span>
                    <h2 className={`text-2xl font-black mt-0.5 ${theme.textTitle}`}>Musik Orkestra & Sound Effects (SFX)</h2>
                  </div>

                  {storyboardShots.length > 0 ? (
                    <div className={`p-6 rounded-3xl border space-y-4 ${theme.cardBg}`}>
                      <h3 className={`font-black text-sm ${theme.textTitle}`}>Daftar Efek Suara per Shot</h3>
                      <div className="space-y-3">
                        {storyboardShots.map((s) => (
                          <div key={s.shotNumber} className={`p-3.5 rounded-2xl border flex items-center justify-between text-xs ${theme.cardInnerBg}`}>
                            <span className="font-bold">Shot #{s.shotNumber}: {s.segmentName}</span>
                            <span className="font-mono text-[11px] text-emerald-700 dark:text-emerald-400">
                              🎵 {s.musicTrack} | SFX: {Array.isArray(s.sfxList) ? s.sfxList.join(', ') : s.sfxList}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div className={`text-center py-16 rounded-3xl border text-xs ${theme.cardBg} ${theme.textMuted}`}>
                      Data audio & SFX belum tersedia.
                    </div>
                  )}
                </div>
              )}

              {/* TAB 7: TIMELINE */}
              {activeTab === 'timeline' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div>
                    <span className="text-xs font-extrabold text-emerald-700 dark:text-emerald-400 uppercase tracking-widest">Sequencer</span>
                    <h2 className={`text-2xl font-black mt-0.5 ${theme.textTitle}`}>Master Editing Timeline</h2>
                  </div>

                  {storyboardShots.length > 0 ? (
                    <div className={`p-6 rounded-3xl border space-y-4 ${theme.cardBg}`}>
                      <div className="flex overflow-x-auto space-x-3 pb-4">
                        {storyboardShots.map((s) => (
                          <div key={s.shotNumber} className="w-40 shrink-0 p-3 rounded-2xl border border-emerald-200 bg-emerald-50/50 text-xs space-y-1">
                            <span className="font-black text-[10px] text-emerald-700 block">SHOT #{s.shotNumber}</span>
                            <div className={`font-bold line-clamp-1 ${theme.textTitle}`}>{s.segmentName}</div>
                            <div className="text-[10px] text-slate-500">{s.cameraComposition}</div>
                            <div className="text-[10px] font-mono text-emerald-800">{s.durationSec} Detik</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div className={`text-center py-16 rounded-3xl border text-xs ${theme.cardBg} ${theme.textMuted}`}>
                      Timeline belum tersedia. Generate dokumenter terlebih dahulu.
                    </div>
                  )}
                </div>
              )}

              {/* TAB 8: EXPORT */}
              {activeTab === 'export' && (
                <div className="max-w-4xl mx-auto space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <span className="text-xs font-extrabold text-emerald-700 dark:text-emerald-400 uppercase tracking-widest">Production Deliverables</span>
                      <h2 className={`text-2xl font-black mt-0.5 ${theme.textTitle}`}>Export Paket Dokumenter</h2>
                    </div>

                    <button
                      onClick={() => copyToClipboard(generateExportText('md'), "Paket Dokumenter Full")}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs px-4 py-2 rounded-xl shadow-lg shadow-emerald-600/20 transition"
                    >
                      📋 Salin Seluruh Paket
                    </button>
                  </div>

                  <div className={`p-6 rounded-3xl border space-y-4 backdrop-blur ${theme.cardBg}`}>
                    <span className={`text-xs font-extrabold uppercase tracking-wider block ${theme.textTitle}`}>Pilihan Format Unduhan</span>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                      <button
                        onClick={() => exportAsFile(generateExportText('txt'), `${formData.subjectName}_Documentary.txt`, 'text/plain')}
                        className={`p-4 rounded-2xl border text-left transition space-y-1 ${theme.cardInnerBg} hover:border-emerald-500`}
                      >
                        <span className="text-xl">📄</span>
                        <div className={`font-extrabold text-xs ${theme.textTitle}`}>Export TXT</div>
                        <div className={`text-[10px] ${theme.textMuted}`}>Plain text format</div>
                      </button>

                      <button
                        onClick={() => exportAsFile(generateExportText('md'), `${formData.subjectName}_Documentary.md`, 'text/markdown')}
                        className={`p-4 rounded-2xl border text-left transition space-y-1 ${theme.cardInnerBg} hover:border-emerald-500`}
                      >
                        <span className="text-xl">📝</span>
                        <div className={`font-extrabold text-xs ${theme.textTitle}`}>Export Markdown</div>
                        <div className={`text-[10px] ${theme.textMuted}`}>Formatted MD</div>
                      </button>

                      <button
                        onClick={() => exportAsFile(generateExportText('txt'), `${formData.subjectName}_Documentary.doc`, 'application/msword')}
                        className={`p-4 rounded-2xl border text-left transition space-y-1 ${theme.cardInnerBg} hover:border-emerald-500`}
                      >
                        <span className="text-xl">📘</span>
                        <div className={`font-extrabold text-xs ${theme.textTitle}`}>Export DOCX</div>
                        <div className={`text-[10px] ${theme.textMuted}`}>Word document</div>
                      </button>

                      <button
                        onClick={() => exportAsFile(JSON.stringify({ formData, masterConsistencySheet, docOutline, fullScript, storyboardShots }, null, 2), `${formData.subjectName}_Documentary.json`, 'application/json')}
                        className={`p-4 rounded-2xl border text-left transition space-y-1 ${theme.cardInnerBg} hover:border-emerald-500`}
                      >
                        <span className="text-xl">⚙️</span>
                        <div className={`font-extrabold text-xs ${theme.textTitle}`}>Export JSON</div>
                        <div className={`text-[10px] ${theme.textMuted}`}>Raw studio data</div>
                      </button>
                    </div>
                  </div>

                  <div className={`p-6 rounded-3xl border space-y-3 backdrop-blur ${theme.cardBg}`}>
                    <span className={`text-xs font-extrabold uppercase tracking-wider block ${theme.textTitle}`}>Preview Naskah Paket</span>
                    <pre className={`p-4 rounded-2xl border text-xs font-mono leading-relaxed overflow-x-auto max-h-96 ${theme.cardInnerBg} ${theme.textTitle}`}>
                      {generateExportText('md')}
                    </pre>
                  </div>
                </div>
              )}

              {/* TAB 9: SETTINGS */}
              {activeTab === 'settings' && (
                <div className="max-w-xl mx-auto space-y-6">
                  <div className={`border p-6 rounded-3xl space-y-5 ${isDarkMode ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-emerald-50/80 border-emerald-200'}`}>
                    <div className="flex items-center space-x-2 text-emerald-700 dark:text-emerald-400 font-extrabold text-xs uppercase tracking-wider">
                      <Icon name="zap" className="w-4 h-4 fill-emerald-500" />
                      <span>PENGATURAN API MODEL</span>
                    </div>

                    <div className="space-y-2">
                      <label className={`text-xs font-bold block ${theme.textTitle}`}>Pilih API Provider</label>
                      <select
                        value={provider}
                        onChange={e => {
                          setProvider(e.target.value);
                          if (e.target.value === 'openrouter') setSelectedModel('openrouter/free');
                          else setSelectedModel('gemini-2.5-flash');
                        }}
                        className={`w-full border-2 border-emerald-500/40 rounded-2xl p-3.5 text-xs font-extrabold focus:outline-none focus:border-emerald-500 cursor-pointer shadow-sm ${theme.inputBg}`}
                      >
                        <option value="openrouter">🌐 OpenRouter (Model Gratis) - Direkomendasikan</option>
                        <option value="gemini">🔵 Google Gemini Direct API Key</option>
                      </select>
                    </div>

                    <div className="space-y-2">
                      <label className={`text-xs font-bold block ${theme.textTitle}`}>Pilih AI Model</label>
                      <select
                        value={selectedModel}
                        onChange={e => setSelectedModel(e.target.value)}
                        className={`w-full rounded-2xl p-3.5 text-xs font-mono focus:outline-none focus:border-emerald-500 cursor-pointer ${theme.inputBg}`}
                      >
                        {provider === 'openrouter' ? (
                          OPENROUTER_FREE_MODELS.map(m => (
                            <option key={m.id} value={m.id}>{m.name}</option>
                          ))
                        ) : (
                          GEMINI_DIRECT_MODELS.map(m => (
                            <option key={m.id} value={m.id}>{m.name}</option>
                          ))
                        )}
                      </select>
                    </div>

                    <div className="space-y-2">
                      <label className={`text-xs font-bold block ${theme.textTitle}`}>
                        {provider === 'openrouter' ? 'OpenRouter API Key (sk-or-v1-...)' : 'Google Gemini API Key (AIzaSy...)'}
                      </label>
                      <input
                        type="password"
                        placeholder={provider === 'openrouter' ? 'sk-or-v1-...' : 'AIzaSy...'}
                        value={provider === 'openrouter' ? openrouterKey : geminiKey}
                        onChange={e => {
                          if (provider === 'openrouter') setOpenrouterKey(e.target.value);
                          else setGeminiKey(e.target.value);
                        }}
                        className={`w-full rounded-2xl p-3.5 text-xs font-mono focus:outline-none focus:border-emerald-500 ${theme.inputBg}`}
                      />
                    </div>

                    <div className="flex space-x-3 pt-2">
                      <button
                        onClick={async () => {
                          try {
                            const resp = await callUniversalAI("Tes koneksi OK", provider, selectedModel, openrouterKey, geminiKey);
                            showToast(`API Key Valid! Respon: ${resp.substring(0, 20)}...`, "success");
                          } catch (err) {
                            showToast(`Uji Coba Gagal: ${err.message}`, "error");
                          }
                        }}
                        className={`flex-1 border p-3 rounded-2xl text-xs font-bold text-center transition ${theme.cardInnerBg} hover:border-emerald-400`}
                      >
                        Uji Coba Key
                      </button>

                      <button
                        onClick={() => {
                          if (provider === 'openrouter') window.open("https://openrouter.ai/keys", "_blank");
                          else window.open("https://aistudio.google.com/app/apikey", "_blank");
                        }}
                        className="flex-1 bg-emerald-600/10 hover:bg-emerald-600/20 border border-emerald-500/40 text-emerald-800 dark:text-emerald-300 p-3 rounded-2xl text-xs font-bold text-center transition"
                      >
                        Dapatkan Key Gratis ↗
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
