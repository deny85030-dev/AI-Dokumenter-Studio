<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Documentary Studio Pro</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        button:active { transform: scale(0.97); }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== LOGIN PAGE STYLES ===== */
        .login-page {
            width: 100%;
            max-width: 420px;
            background: #0d1423;
            border-radius: 24px;
            padding: 36px 32px;
            border: 1px solid #1a2a4a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .login-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6c5ce7, #a855f7, #6c5ce7);
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-page .logo .icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 12px;
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.3);
        }
        .login-page .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #080c18;
            border: 1px solid #1a2a4a;
            border-radius: 12px;
            color: #e8edf5;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .login-page .form-group input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        .login-page .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .login-page .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.35);
        }
        .login-page .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .login-page .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #ef4444;
            display: none;
            margin-bottom: 12px;
            text-align: center;
        }
        .login-page .error-msg.show {
            display: block;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .login-page .contact-info a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
        }
        .login-page .contact-info a:hover {
            text-decoration: underline;
        }
        .spinner-small {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.15);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-page { padding: 24px 20px; border-radius: 16px; }
            .login-page .logo h1 { font-size: 19px; }
            .login-page .logo .icon { width: 48px; height: 48px; font-size: 22px; }
        }

        /* Loading container untuk aplikasi utama */
        .app-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #667799;
            flex-direction: column;
            gap: 16px;
        }
        .app-loader .loader {
            border: 3px solid rgba(255,255,255,0.08);
            border-top: 3px solid #6c5ce7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <!-- ========================================================== -->
    <!-- ROOT UNTUK REACT (Aplikasi Utama) -->
    <!-- ========================================================== -->
    <div id="root"></div>

    <script type="text/babel">

        // ============================================================

            return <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" className={className}>{icons[name] || icons.zap}</svg>;
        };

        // ============================================================
        // 2. KOMPONEN LOGIN
        // ============================================================
        function LoginPage({ onLoginSuccess }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const VALID_CREDENTIALS = {
                username: 'admin',
                password: '12345'
            };

            const handleLogin = () => {
                setError('');
                
                if (!username.trim() || !password.trim()) {
                    setError('Username dan password harus diisi!');
                    return;
                }

                if (username === VALID_CREDENTIALS.username && password === VALID_CREDENTIALS.password) {
                    setIsLoading(true);
                    localStorage.setItem('studio_session', 'logged_in');
                    setTimeout(() => {
                        onLoginSuccess();
                    }, 500);
                } else {
                    setError('Username atau password salah! Hubungi admin jika lupa.');
                    setPassword('');
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') handleLogin();
            };

            return (
                <div style={{
                    display: 'flex',
                    justifyContent: 'center',
                    alignItems: 'center',
                    minHeight: '100vh',
                    background: '#05070f',
                    padding: '20px'
                }}>
                    <div className="login-page">
                        <div className="logo">
                            <div className="icon"><i className="fa-solid fa-wand-magic-sparkles"></i></div>
                            <h1 style={{ fontSize: '22px', fontWeight: 800, color: '#f0f4f8' }}>Studio Konten Pro</h1>
                            <p style={{ color: '#667799', fontSize: '13px', marginTop: '4px' }}>Masuk untuk mengakses aplikasi</p>
                        </div>

                        {error && (
                            <div className="error-msg show">
                                <i className="fa-solid fa-circle-exclamation"></i>
                                <span>{error}</span>
                            </div>
                        )}

                        <div className="form-group">
                            <label style={{ display: 'block', fontSize: '12px', fontWeight: 600, color: '#667799', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '6px' }}>
                                <i className="fa-regular fa-user"></i> Nama Pengguna
                            </label>
                            <input 
                                type="text" 
                                placeholder="Masukkan username..." 
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                                onKeyDown={handleKeyDown}
                                autoComplete="username"
                            />
                        </div>

                        <div className="form-group">
                            <label style={{ display: 'block', fontSize: '12px', fontWeight: 600, color: '#667799', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '6px' }}>
                                <i className="fa-solid fa-lock"></i> Kata Sandi
                            </label>
                            <input 
                                type="password" 
                                placeholder="Masukkan password..." 
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                onKeyDown={handleKeyDown}
                                autoComplete="current-password"
                            />
                        </div>

                        <button className="btn-login" onClick={handleLogin} disabled={isLoading}>
                            {isLoading ? (
                                <>
                                    <span className="spinner-small"></span> Memproses...
                                </>
                            ) : (
                                <>
                                    <i className="fa-solid fa-arrow-right-to-bracket"></i> Masuk
                                </>
                            )}
                        </button>

                            Belum punya akses? Hubungi Admin:
                            <a href="tel:087763865954"><strong>0877-6386-5954</strong></a>
                            <br />
                            <span style={{ fontSize: '11px', color: '#445566' }}>(WhatsApp / Telepon)</span>
                        </div>

        // ============================================================
        // 4. HELPERS
        // ============================================================
        function extractJSON(text) {
            if (!text) return null;
            try { return JSON.parse(text); } catch (e) {}
            const cleaned = text.replace(/```json/gi, '').replace(/```/g, '').trim();
            try { return JSON.parse(cleaned); } catch (e) {}
            const match = cleaned.match(/\{[\s\S]*\}/);
            if (match) { try { return JSON.parse(match[0]); } catch (e) {} }
            return null;
        }

        function getPresetsForCategory(catId) {
            return PRESET_POOL[catId] || [];
        }

        async function callAI(prompt, provider, model, openrouterKey, geminiKey) {
            if (provider === 'openrouter') {
                if (!openrouterKey?.trim()) throw new Error("Masukkan OpenRouter API Key di Settings");
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${openrouterKey.trim()}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.origin || "https://github.com"
                    },
                    body: JSON.stringify({
                        model: model || "openrouter/free",
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7
                    })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || `Error ${res.status}`);
                }
                const data = await res.json();
                return data.choices?.[0]?.message?.content || "";
            } else {
                if (!geminiKey?.trim()) throw new Error("Masukkan Google Gemini API Key di Settings");
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model || "gemini-2.5-flash"}:generateContent?key=${geminiKey.trim()}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || `Error ${res.status}`);
                }
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            }
        }

                                                                <span>PROMPT VISUAL</span>
                                                            </span>
                                                            <button onClick={() => copyText(s.imagePrompt, 'Prompt Visual')} 
                                                                className="px-3 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 text-[10px] font-bold hover:bg-emerald-600 hover:text-white transition">
                                                                Salin
                                                            </button>
                                                        </div>
                                                        <div className="p-3 rounded-xl bg-slate-950 text-slate-200 border border-slate-800">
                                                            <p className="text-[11px] font-mono leading-relaxed">{s.imagePrompt}</p>
                                                        </div>
                                                    </div>

                                                    <div className="mt-3">
                                                        <div className="flex items-center justify-between mb-1.5">
                                                            <span className="font-bold text-xs text-purple-600 dark:text-purple-400 flex items-center space-x-1">
                                                                <Icon name="video" className="w-3.5 h-3.5" />
                                                                <span>PROMPT VIDEO</span>
                                                            </span>
                                                            <button onClick={() => copyText(s.videoPrompt, 'Prompt Video')} 
                                                                className="px-3 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 text-[10px] font-bold hover:bg-purple-600 hover:text-white transition">
                                                                Salin
                                                            </button>
                                                        </div>
                                                        <div className="p-3 rounded-xl bg-slate-950 text-slate-200 border border-slate-800">
                                                            <p className="text-[11px] font-mono leading-relaxed">{s.videoPrompt}</p>
                                                        </div>
                                                    </div>

                                                    <div className="mt-3 flex flex-wrap gap-2 text-[10px] text-slate-500 pt-2 border-t dark:border-slate-800">
                                                        <span>📷 {s.camera}</span>
                                                        <span>🎬 {s.movement}</span>
                                                        <span>🎨 {s.composition}</span>
                                                        <span>💡 {s.lighting}</span>
                                                        <span>🎭 {s.mood}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="mt-4 p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-200 dark:border-emerald-800">
                                            <div className="flex items-center justify-between flex-wrap gap-2">
                                                <div>
                                                    <span className="font-bold text-xs text-emerald-700 dark:text-emerald-300">📦 Semua Prompt Siap Digunakan</span>
                                                    <p className="text-[10px] text-slate-500">Salin prompt untuk Midjourney, Stable Diffusion, Runway, Luma, Kling</p>
                                                </div>
                                                <button onClick={() => {
                                                    const prompts = storyboard.map(s => 
                                                        `SHOT ${s.number} - ${s.segment}\nT2I: ${s.imagePrompt}\nI2V: ${s.videoPrompt}`
                                                    ).join('\n---\n');
                                                    copyText(prompts, 'Semua Prompt');
                                                }} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs hover:bg-emerald-700 transition flex items-center space-x-1.5">
                                                    <Icon name="copy" className="w-4 h-4" />
                                                    <span>Salin Semua Prompt</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className={`${theme.card} p-12 rounded-2xl border text-center`}>
                                        <span className="text-4xl block mb-4">🎬</span>
                                        <h3 className={`font-bold text-lg ${theme.title}`}>Belum Ada Storyboard</h3>
                                        <p className={`text-sm ${theme.muted} mt-2`}>Pilih preset dan klik <strong>Buat Dokumenter</strong> di tab Studio</p>
                                        <button onClick={() => setTab('studio')} className="mt-4 px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700 transition">Ke Studio</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB: METADATA */}
                        {tab === 'metadata' && (
                            <div className="slide-up">
                                {metadata ? (
                                    <div className={`${theme.card} p-6 rounded-2xl border space-y-5`}>
                                        <div className="flex items-center justify-between border-b pb-4 dark:border-slate-800">
                                            <div>
                                                <h2 className={`font-black text-lg ${theme.title}`}>🚀 YouTube Metadata</h2>
                                                <p className={`text-xs ${theme.muted}`}>Judul, deskripsi, hashtag & thumbnail</p>
                                            </div>
                                            <button onClick={() => copyText(JSON.stringify(metadata, null, 2), 'Metadata')} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs hover:bg-emerald-700 transition flex items-center space-x-1.5">
                                                <Icon name="copy" className="w-4 h-4" />
                                                <span>Salin</span>
                                            </button>
                                        </div>

                                        <div>
                                            <h3 className="font-bold text-xs uppercase text-slate-500 mb-2">📌 Judul Pilihan</h3>
                                            {metadata.titles?.map((t, i) => (
                                                <div key={i} className={`${theme.inner} p-3 rounded-xl border flex items-center justify-between mb-1.5`}>
                                                    <span className="text-xs font-medium">{i+1}. {t}</span>
                                                    <button onClick={() => copyText(t, 'Judul')} className="px-3 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 text-[10px] font-bold hover:bg-emerald-600 hover:text-white transition">Salin</button>
                                                </div>
                                            ))}
                                        </div>

                                        <div>
                                            <h3 className="font-bold text-xs uppercase text-slate-500 mb-2">📝 Deskripsi</h3>
                                            <textarea readOnly rows={5} value={metadata.description} className={`w-full text-xs font-mono p-3 rounded-xl border ${theme.input} focus:outline-none`} />
                                        </div>

                                        <div>
                                            <h3 className="font-bold text-xs uppercase text-slate-500 mb-2">🏷️ Hashtag</h3>
                                            <div className="flex flex-wrap gap-1.5">
                                                {metadata.hashtags?.map((h, i) => <span key={i} className="px-2.5 py-1 rounded-lg bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 text-xs font-bold border border-emerald-300 dark:border-emerald-800">{h}</span>)}
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="font-bold text-xs uppercase text-slate-500 mb-2">🖼️ Prompt Thumbnail</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                {metadata.thumbnails?.map((t, i) => (
                                                    <div key={i} className={`${theme.inner} p-3 rounded-xl border space-y-2`}>
                                                        <span className="font-bold text-xs text-emerald-600 block">{t.concept}</span>
                                                        <div className="p-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 text-[10px] font-bold text-amber-800 dark:text-amber-200">💬 {t.text}</div>
                                                        <p className="text-[10px] font-mono text-slate-600 dark:text-slate-400 leading-relaxed">{t.prompt}</p>
                                                        <button onClick={() => copyText(t.prompt, 'Thumbnail')} className="w-full py-1.5 rounded-lg bg-emerald-600 text-white font-bold text-[10px] hover:bg-emerald-700 transition">Salin</button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className={`${theme.card} p-12 rounded-2xl border text-center`}>
                                        <span className="text-4xl block mb-4">🚀</span>
                                        <h3 className={`font-bold text-lg ${theme.title}`}>Belum Ada Metadata</h3>
                                        <p className={`text-sm ${theme.muted} mt-2`}>Pilih preset dan klik <strong>Buat Dokumenter</strong> di tab Studio</p>
                                        <button onClick={() => setTab('studio')} className="mt-4 px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700 transition">Ke Studio</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB: SETTINGS */}
                        {tab === 'settings' && (
                            <div className="max-w-xl mx-auto space-y-6">
                                <div className={`border p-6 rounded-2xl space-y-5 ${!hasValidKey() ? (dark ? 'bg-rose-950/20 border-rose-500/30' : 'bg-rose-50/80 border-rose-200') : (dark ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-emerald-50/80 border-emerald-200')}`}>
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center space-x-2">
                                            <Icon name="settings" className="w-5 h-5 text-emerald-600" />
                                            <span className={`font-extrabold text-xs uppercase tracking-wider ${theme.title}`}>Pengaturan API Model</span>
                                        </div>
                                        <span className={`text-[10px] font-bold px-2 py-1 rounded-lg ${hasValidKey() ? 'bg-emerald-200 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300' : 'bg-rose-200 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300'}`}>
                                            {hasValidKey() ? '✅ Terhubung' : '🔒 Belum'}
                                        </span>
                                    </div>

                                    {!hasValidKey() && (
                                        <div className="p-3 rounded-xl bg-rose-100 dark:bg-rose-950/40 border border-rose-300 dark:border-rose-700 text-xs text-rose-800 dark:text-rose-300">
                                            ⚠️ <strong>API Key wajib diisi</strong> agar aplikasi bisa bekerja.
                                        </div>
                                    )}

                                    <div className="space-y-2">
                                        <label className={`text-xs font-bold block ${theme.title}`}>Pilih API Provider</label>
                                        <select
                                            value={provider}
                                            onChange={e => {
                                                setProvider(e.target.value);
                                                if (e.target.value === 'openrouter') setModel('openrouter/free');
                                                else setModel('gemini-2.5-flash');
                                            }}
                                            className={`w-full rounded-xl p-3.5 text-xs font-extrabold focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer ${theme.input}`}
                                        >
                                            <option value="openrouter">🌐 OpenRouter (Model Gratis)</option>
                                            <option value="gemini">🔵 Google Gemini Direct</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className={`text-xs font-bold block ${theme.title}`}>Pilih AI Model</label>
                                        <select
                                            value={model}
                                            onChange={e => setModel(e.target.value)}
                                            className={`w-full rounded-xl p-3.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer ${theme.input}`}
                                        >
                                            {provider === 'openrouter' ? (
                                                OPENROUTER_MODELS.map(m => (
                                                    <option key={m.id} value={m.id}>{m.name} {m.tag ? `(${m.tag})` : ''}</option>
                                                ))
                                            ) : (
                                                GEMINI_MODELS.map(m => (
                                                    <option key={m.id} value={m.id}>{m.name} {m.tag ? `(${m.tag})` : ''}</option>
                                                ))
                                            )}
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className={`text-xs font-bold block ${theme.title}`}>
                                            {provider === 'openrouter' ? '🔑 OpenRouter API Key' : '🔑 Google Gemini API Key'}
                                        </label>
                                        <input
                                            type="password"
                                            placeholder={provider === 'openrouter' ? 'sk-or-v1-...' : 'AIzaSy...'}
                                            value={provider === 'openrouter' ? openrouterKey : geminiKey}
                                            onChange={e => {
                                                if (provider === 'openrouter') setOpenrouterKey(e.target.value);
                                                else setGeminiKey(e.target.value);
                                            }}
                                            className={`w-full rounded-xl p-3.5 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500 ${theme.input}`}
                                        />
                                        <p className="text-[10px] text-slate-400">Dapatkan gratis di <a href={provider === 'openrouter' ? 'https://openrouter.ai/keys' : 'https://aistudio.google.com/app/apikey'} target="_blank" className="text-emerald-600 hover:underline">OpenRouter</a></p>
                                    </div>

                                    <div className="flex space-x-3 pt-2">
                                        <button
                                            onClick={async () => {
                                                if (!hasValidKey()) {
                                                    showToast('⚠️ Isi API Key dulu!', 'error');
                                                    return;
                                                }
                                                try {
                                                    await callAI("Balas: OK", provider, model, openrouterKey, geminiKey);
                                                    showToast(`✅ Koneksi Berhasil!`, "success");
                                                } catch (err) {
                                                    showToast(`❌ Gagal: ${err.message}`, "error");
                                                }
                                            }}
                                            className={`flex-1 border p-3 rounded-xl text-xs font-bold text-center transition ${theme.inner} hover:border-emerald-400`}
                                        >
                                            🔌 Uji Koneksi
                                        </button>

                                        <button
                                            onClick={() => {
                                                if (provider === 'openrouter') window.open("https://openrouter.ai/keys", "_blank");
                                                else window.open("https://aistudio.google.com/app/apikey", "_blank");
                                            }}
                                            className="flex-1 bg-emerald-600/10 hover:bg-emerald-600/20 border border-emerald-500/40 text-emerald-800 dark:text-emerald-300 p-3 rounded-xl text-xs font-bold text-center transition"
                                        >
                                            🆓 Dapatkan Key
                                        </button>
                                    </div>
                                </div>

                                <div className={`${theme.card} p-4 rounded-2xl border text-xs space-y-2`}>
                                    <h3 className={`font-bold ${theme.title}`}>📌 Status API</h3>
                                    <div className="flex items-center space-x-2">
                                        <span className={`w-2 h-2 rounded-full ${hasValidKey() ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                                        <span className={hasValidKey() ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}>
                                            {hasValidKey() ? 'Siap Generate' : 'Belum Diisi'}
                                        </span>
                                    </div>
                                    <p className="text-[10px] text-slate-400">
                                        Provider: <strong>{provider === 'openrouter' ? 'OpenRouter' : 'Gemini'}</strong> · Model: <strong>{model}</strong>
                                    </p>
                                </div>
                            </div>
                        )}

                    </main>

                    <footer className={`border-t py-6 text-center text-xs transition-colors ${dark ? 'bg-slate-900/90 border-slate-800 text-slate-400' : 'bg-white/95 border-slate-200 text-slate-500'}`}>
                        <p className="font-medium">AI Documentary Studio Pro • {currentPresets.length} Preset • Pilih preset → Buat Dokumenter</p>
                    </footer>
                </div>
            );
        }

        // ============================================================
        // 6. KOMPONEN UTAMA (LOGIN + STUDIO)
        // ============================================================
        function MainApp() {
            const [isLoggedIn, setIsLoggedIn] = useState(() => {
                return localStorage.getItem('studio_session') === 'logged_in';
            });

            if (!isLoggedIn) {
                return <LoginPage onLoginSuccess={() => setIsLoggedIn(true)} />;
            }

            return <StudioApp />;
        }

        // ============================================================
        // RENDER
        // ============================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
